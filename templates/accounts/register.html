{% extends "base.html" %}
{% block title %}ثبت‌نام{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4">
      <h4 class="mb-3 text-center">ثبت‌نام در فروشگاه</h4>
      <form method="post">
        {% csrf_token %}
        {% for field in form %}
          <div class="mb-3">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
          </div>
        {% endfor %}
        <button type="submit" class="btn btn-success w-100">ثبت‌نام و دریافت کد تایید</button>
      </form>
      <p class="mt-3 text-center">حساب کاربری دارید؟ <a href="{% url 'accounts:login' %}">ورود</a></p>
    </div>
  </div>
</div>
{% endblock %}
