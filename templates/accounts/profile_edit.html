{% extends "base.html" %}
{% block title %}ویرایش پروفایل{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4">
      <h4 class="mb-3">ویرایش پروفایل</h4>
      <form method="post">
        {% csrf_token %}
        {% for field in form %}
          <div class="mb-3">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
          </div>
        {% endfor %}
        <button type="submit" class="btn btn-success w-100">ذخیره تغییرات</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
