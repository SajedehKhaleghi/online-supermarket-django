{% extends "base.html" %}
{% block title %}ورود{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <div class="card p-4">
      <h4 class="mb-3 text-center">ورود به حساب کاربری</h4>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">نام کاربری</label>
          {{ form.username }}
        </div>
        <div class="mb-3">
          <label class="form-label">رمز عبور</label>
          {{ form.password }}
        </div>
        {% if form.errors %}<div class="text-danger small mb-2">نام کاربری یا رمز عبور اشتباه است.</div>{% endif %}
        <button type="submit" class="btn btn-success w-100">ورود</button>
      </form>
      <p class="mt-3 text-center">حساب ندارید؟ <a href="{% url 'accounts:register' %}">ثبت‌نام</a></p>
    </div>
  </div>
</div>
{% endblock %}
